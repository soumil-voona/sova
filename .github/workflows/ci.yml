name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x install.sh sova src/*.sh tests/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS ships Bash 3.2, the oldest version Sova supports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Use the system Bash 3.2 on macOS
        if: runner.os == 'macOS'
        # The runner image puts Homebrew's Bash 5 first on PATH; sova and the
        # tests run "bash" through PATH, so point it at /bin/bash instead.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Show tool versions
        run: |
          bash --version | head -1
          python3 --version
          node --version
      - name: Run tests
        env:
          # Fail instead of skipping when python3 or node is missing.
          SOVA_TEST_STRICT: "1"
        run: bash tests/run_all.sh
